<title>Asmi's Maths Term 4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one column "workbook". Level switch at top; each level has 3 units of 3 lessons, then review.
   A lesson opens as its own view: parent script, diagram, worked examples, then a practice round. */
:root{
  --bg:#f2f5f0; --card:#ffffff; --ink:#1c2a27; --muted:#56665f; --line:#d6dfd8;
  --gum:#2d7a67; --gum-ink:#1f5c4d; --gum-soft:#dcefe7;
  --wattle:#e9a91c; --wattle-ink:#94660a; --wattle-soft:#fcefcc;
  --sky:#3a78bd; --sky-soft:#dde8f5;
  --coral:#d4593f; --coral-soft:#fae2db;
  --water:#8cc2ea; --cube:#e07a5f;
  --c1:#2d7a67; --c2:#e9a91c; --c3:#3a78bd; --c4:#d4593f; --c5:#8a5cb8;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111c19; --card:#1a2925; --ink:#e7efeb; --muted:#9db0a8; --line:#2c3e39;
  --gum:#5cbfa3; --gum-ink:#8fd8c2; --gum-soft:#1d3a33;
  --wattle:#f2bf4b; --wattle-ink:#f5cd6f; --wattle-soft:#3a311c;
  --sky:#7eb0e6; --sky-soft:#1d2e42;
  --coral:#ef8a72; --coral-soft:#3d241f;
  --water:#3f7fae; --cube:#d9775e;
  --c1:#5cbfa3; --c2:#f2bf4b; --c3:#7eb0e6; --c4:#ef8a72; --c5:#b48fe0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111c19; --card:#1a2925; --ink:#e7efeb; --muted:#9db0a8; --line:#2c3e39;
  --gum:#5cbfa3; --gum-ink:#8fd8c2; --gum-soft:#1d3a33;
  --wattle:#f2bf4b; --wattle-ink:#f5cd6f; --wattle-soft:#3a311c;
  --sky:#7eb0e6; --sky-soft:#1d2e42;
  --coral:#ef8a72; --coral-soft:#3d241f;
  --water:#3f7fae; --cube:#d9775e;
  --c1:#5cbfa3; --c2:#f2bf4b; --c3:#7eb0e6; --c4:#ef8a72; --c5:#b48fe0;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,6vw,40px)}
h2{font-size:24px}
h3{font-size:19px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--gum-ink)}

/* header */
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.hello{display:flex;flex-direction:column;gap:4px}
.stars{display:flex;align-items:center;gap:8px;background:var(--wattle-soft);color:var(--wattle-ink);padding:8px 14px;border-radius:999px;font-weight:800;font-variant-numeric:tabular-nums}
.stars svg{width:22px;height:22px}
.switch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.switch button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:700;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--gum);color:var(--card)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:18px;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:none;padding:6px 2px 10px;font-weight:800;color:var(--muted);margin-bottom:-2px;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--wattle)}

/* level intro */
.intro{background:var(--gum-soft);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.intro p{max-width:62ch}

/* units */
.unit{display:flex;flex-direction:column;gap:12px}
.unit-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.lesson{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.lesson:hover{transform:translateY(-2px);border-color:var(--gum)}
.lesson .num{font-family:var(--f-display);font-size:14px;color:var(--gum-ink);font-weight:600}
.lesson .t{font-weight:800;font-size:17px;line-height:1.3}
.lesson .d{font-size:14px;color:var(--muted);flex:1}
.lesson .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.lesson.review{background:var(--wattle-soft);border-color:transparent}
.lesson.review .num{color:var(--wattle-ink)}
.mini-stars{display:inline-flex;gap:2px}
.mini-stars svg{width:16px;height:16px}

/* lesson view */
.back{align-self:flex-start;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}
.lesson-title{display:flex;flex-direction:column;gap:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.say{background:var(--sky-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.say .lab{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--sky)}
.say p{max-width:65ch}
.facts{background:var(--wattle-soft);border-radius:12px;padding:14px 16px}
.facts ul{margin:6px 0 0;padding-left:20px}
.diagram{display:flex;justify-content:center;overflow-x:auto}
.diagram svg{max-width:100%;height:auto}
.caption{font-size:14px;color:var(--muted);text-align:center}
.examples{display:flex;flex-direction:column;gap:10px}
details.ex{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details.ex summary{cursor:pointer;font-weight:700;list-style:none;display:flex;gap:10px}
details.ex summary::-webkit-details-marker{display:none}
details.ex summary .tag{flex:none;font-size:12px;font-weight:800;background:var(--gum-soft);color:var(--gum-ink);border-radius:6px;padding:2px 8px;height:fit-content;margin-top:2px}
details.ex .sol{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
details.ex .reveal{font-size:13px;color:var(--muted);font-weight:600;margin-left:auto;flex:none}
details.ex[open] .reveal{display:none}
.yourturn{background:var(--gum-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.yourturn .lab{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--gum-ink)}
.hands ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
table.tt{border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:100%}
table.tt th,table.tt td{border:1px solid var(--line);padding:6px 10px;text-align:center}
table.tt th{background:var(--gum-soft);font-weight:800}
.tablewrap{overflow-x:auto}

/* practice */
.practice{background:var(--card);border:2px solid var(--gum);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.dots i.ok{background:var(--gum)}
.dots i.no{background:var(--coral)}
.dots i.now{outline:2px solid var(--ink);outline-offset:2px}
.qtext{font-size:20px;font-weight:700;max-width:60ch}
.qvis{display:flex;justify-content:center;overflow-x:auto}
.qvis svg{max-width:100%;height:auto}
.answer{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.answer input{font:inherit;font-size:22px;font-weight:800;width:150px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.answer .unitlab{font-weight:800;font-size:20px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.choice{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-weight:800;font-size:18px;display:flex;justify-content:center;align-items:center;gap:6px;min-height:56px}
.choice:hover{border-color:var(--gum)}
.choice.sel{border-color:var(--sky);background:var(--sky-soft)}
.choice.right{border-color:var(--gum);background:var(--gum-soft)}
.choice.wrong{border-color:var(--coral);background:var(--coral-soft)}
.choice svg{max-width:100%;height:auto}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:800;background:var(--gum);color:var(--card)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{padding:6px 12px;font-size:14px}
.feedback{border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.feedback.ok{background:var(--gum-soft)}
.feedback.no{background:var(--coral-soft)}
.feedback strong{font-family:var(--f-display);font-size:19px;font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.result{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:10px 0}
.result .big-stars{display:flex;gap:6px}
.result .big-stars svg{width:46px;height:46px}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;font-variant-numeric:tabular-nums;vertical-align:middle}
.frac span:first-child{border-bottom:2px solid currentColor;padding:0 3px 2px}
.frac span:last-child{padding-top:2px}

/* parent corner */
.checklist{display:flex;flex-direction:column;gap:8px}
.checklist label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checklist input{width:20px;height:20px;margin-top:3px;accent-color:var(--gum);flex:none}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid3 > div{min-width:0}
.grid3 ul{margin:4px 0 0;padding-left:20px;font-size:15px}

/* svg text */
svg text{font-family:var(--f-body);fill:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.qtext{font-size:18px}.practice,.panel{padding:16px}}
</style>

<div class="wrap" id="app">
  <header>
    <div class="hello">
      <span class="eyebrow">Victorian Curriculum · Term 4 home learning</span>
      <h1>Asmi's Maths Term 4</h1>
    </div>
    <div class="stars" title="Stars earned in practice rounds">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" style="fill:var(--wattle)"/></svg>
      <span id="starCount">0</span>&nbsp;stars
    </div>
  </header>

  <div class="toolbar">
    <div class="switch" role="group" aria-label="Choose level">
      <button id="lvY2" aria-pressed="true">Year 2 · now</button>
      <button id="lvY3" aria-pressed="false">Year 3 · next</button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabLearn" aria-selected="true">Lessons</button>
      <button role="tab" id="tabParent" aria-selected="false">Parent corner</button>
    </div>
  </div>

  <main id="view"></main>
</div>

<script>
/* ---------- helpers ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const P=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function opts(ans,distract,n=4){ans=String(ans);const d=[...new Set(distract.map(String))].filter(x=>x!==ans);return shuffle([ans,...shuffle(d).slice(0,n-1)])}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MDAYS=[31,28,31,30,31,30,31,31,30,31,30,31];
const SEASON=m=>[0,1,11].includes(m)?'Summer':m<=4?'Autumn':m<=7?'Winter':'Spring';
const ord=n=>n+(n%100>=11&&n%100<=13?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th'));
const fmt=(h,m)=>`${h}:${String(m).padStart(2,'0')}`;
const nextH=h=>h%12+1, prevH=h=>(h+10)%12+1;
function words(h,m){
  if(m===0)return `${h} o'clock`; if(m===15)return `quarter past ${h}`; if(m===30)return `half past ${h}`; if(m===45)return `quarter to ${nextH(h)}`;
  if(m<30)return `${m} minute${m===1?'':'s'} past ${h}`; const t=60-m; return `${t} minute${t===1?'':'s'} to ${nextH(h)}`;
}
function addMin(h,m,d){let t=(h%12)*60+m+d; t=((t%720)+720)%720; let H=Math.floor(t/60),M=t%60; return [H===0?12:H,M]}
const STAR='M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z';
const starsSVG=(n,max=3)=>Array.from({length:max},(_,i)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${STAR}" style="fill:${i<n?'var(--wattle)':'var(--line)'}"/></svg>`).join('');
const fracHTML=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;

/* ---------- diagrams (SVG) ---------- */
function clock(h,m,size=200){
  const pt=(deg,r)=>[100+r*Math.sin(deg*Math.PI/180),100-r*Math.cos(deg*Math.PI/180)];
  let s=`<svg viewBox="0 0 200 200" width="${size}" height="${size}" role="img" aria-label="analogue clock"><circle cx="100" cy="100" r="94" style="fill:var(--card);stroke:var(--ink);stroke-width:5"/>`;
  for(let i=0;i<60;i++){const big=i%5===0;const [x1,y1]=pt(i*6,big?78:84),[x2,y2]=pt(i*6,89);s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(--ink);stroke-width:${big?3:1.2}"/>`}
  for(let n=1;n<=12;n++){const [x,y]=pt(n*30,64);s+=`<text x="${x}" y="${y+7}" text-anchor="middle" font-size="20" font-weight="800">${n}</text>`}
  const [hx,hy]=pt((h%12)*30+m*.5,46),[mx,my]=pt(m*6,74);
  s+=`<line x1="100" y1="100" x2="${hx}" y2="${hy}" style="stroke:var(--ink);stroke-width:8;stroke-linecap:round"/>`;
  s+=`<line x1="100" y1="100" x2="${mx}" y2="${my}" style="stroke:var(--coral);stroke-width:4.5;stroke-linecap:round"/>`;
  return s+`<circle cx="100" cy="100" r="6" style="fill:var(--ink)"/></svg>`;
}
function calendar(y,mo,marks={}){
  const first=(new Date(y,mo,1).getDay()+6)%7, n=(mo===1&&y%4===0)?29:MDAYS[mo];
  const rows=Math.ceil((first+n)/7), cw=46, ch=36, W=cw*7+8, H=60+rows*ch+6;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="calendar for ${MONTHS[mo]} ${y}"><rect x="1" y="1" width="${W-2}" height="${H-2}" rx="10" style="fill:var(--card);stroke:var(--line);stroke-width:2"/>`;
  s+=`<text x="${W/2}" y="26" text-anchor="middle" font-size="17" font-weight="800">${MONTHS[mo]} ${y}</text>`;
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach((d,i)=>s+=`<text x="${4+i*cw+cw/2}" y="50" text-anchor="middle" font-size="12" font-weight="800" style="fill:${i>4?'var(--coral)':'var(--muted)'}">${d}</text>`);
  for(let d=1;d<=n;d++){const c=(first+d-1)%7,r=Math.floor((first+d-1)/7),x=4+c*cw,yy=58+r*ch;
    const mk=marks[d];
    s+=`<rect x="${x+2}" y="${yy}" width="${cw-4}" height="${ch-4}" rx="6" style="fill:${mk?'var(--wattle-soft)':'var(--bg)'};stroke:${mk?'var(--wattle)':'none'};stroke-width:2"/>`;
    s+=`<text x="${x+cw/2}" y="${yy+(mk?15:21)}" text-anchor="middle" font-size="${mk?12:14}" font-weight="700">${d}</text>`;
    if(mk)s+=`<text x="${x+cw/2}" y="${yy+28}" text-anchor="middle" font-size="9" font-weight="800" style="fill:var(--wattle-ink)">${esc(mk)}</text>`;
  }
  return s+'</svg>';
}
function tally(n,scale=1){
  const groups=Math.floor(n/5),rest=n%5;let x=8,s='';
  for(let g=0;g<groups;g++){for(let i=0;i<4;i++)s+=`<line x1="${x+i*9}" y1="8" x2="${x+i*9}" y2="44" style="stroke:var(--ink);stroke-width:3;stroke-linecap:round"/>`;s+=`<line x1="${x-5}" y1="38" x2="${x+32}" y2="14" style="stroke:var(--coral);stroke-width:3;stroke-linecap:round"/>`;x+=52}
  for(let i=0;i<rest;i++)s+=`<line x1="${x+i*9}" y1="8" x2="${x+i*9}" y2="44" style="stroke:var(--ink);stroke-width:3;stroke-linecap:round"/>`;
  const W=Math.max(x+rest*9+10,40);
  return `<svg viewBox="0 0 ${W} 52" width="${W*scale}" role="img" aria-label="tally marks">${s}</svg>`;
}
function tallyChart(rows){
  let s='', W=380, H=24+rows.length*54;
  s+=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="tally chart"><rect x="1" y="1" width="${W-2}" height="${H-2}" rx="10" style="fill:var(--card);stroke:var(--line);stroke-width:2"/>`;
  rows.forEach((r,i)=>{const y=14+i*54;s+=`<text x="16" y="${y+30}" font-size="16" font-weight="800">${esc(r.label)}</text><g transform="translate(130 ${y})">${tally(r.n).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')}</g>`;if(i)s+=`<line x1="10" y1="${y-4}" x2="${W-10}" y2="${y-4}" style="stroke:var(--line)"/>`});
  return s+'</svg>';
}
function picGraph(rows,per,unit='children'){
  const r=12,gap=28,lw=100,maxSym=Math.max(...rows.map(o=>Math.ceil(o.n/per)));
  const W=lw+maxSym*gap+24, H=rows.length*38+56;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="picture graph"><rect x="1" y="1" width="${W-2}" height="${H-2}" rx="10" style="fill:var(--card);stroke:var(--line);stroke-width:2"/>`;
  rows.forEach((o,i)=>{const y=26+i*38;s+=`<text x="14" y="${y+6}" font-size="15" font-weight="800">${esc(o.label)}</text>`;
    const full=Math.floor(o.n/per),half=o.n%per;
    for(let k=0;k<full;k++)s+=`<circle cx="${lw+k*gap+r}" cy="${y}" r="${r}" style="fill:var(--c${(i%5)+1})"/>`;
    if(half){const cx=lw+full*gap+r;s+=`<path d="M${cx} ${y-r} A${r} ${r} 0 0 0 ${cx} ${y+r} Z" style="fill:var(--c${(i%5)+1})"/>`}
  });
  const ky=H-18;
  s+=`<line x1="10" y1="${ky-20}" x2="${W-10}" y2="${ky-20}" style="stroke:var(--line)"/><text x="14" y="${ky+4}" font-size="14" font-weight="700">Key:</text><circle cx="62" cy="${ky}" r="9" style="fill:var(--muted)"/><text x="78" y="${ky+5}" font-size="14" font-weight="700">= ${per} ${per===1?unit.replace(/ren$/,'').replace(/s$/,''):unit}</text>`;
  return s+'</svg>';
}
function colGraph(labels,vals,step,max,title='',yLabel='Number of children'){
  const W=400,H=270,L=52,B=50,T=title?34:14,Rm=10, ph=H-B-T, pw=W-L-Rm, slot=pw/labels.length;
  const y=v=>H-B-v/max*ph;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="column graph">`;
  if(title)s+=`<text x="${W/2}" y="20" text-anchor="middle" font-size="15" font-weight="800">${esc(title)}</text>`;

function jug(level,max=1000,labelStep=100,minor=50,showLabels=true,size=220){

  s+=`<path d="M30 70 Q6 74 8 130 Q10 190 50 200" style="fill:none;stroke:var(--muted);stroke-width:9;stroke-linecap:round"/>`;
  if(level>0)s+=`<rect x="52" y="${y(level)}" width="116" height="${bot-y(level)}" style="fill:var(--water);opacity:.85"/>`;
  s+=`<path d="M48 ${top-14} L48 ${bot} Q48 ${bot+8} 56 ${bot+8} L164 ${bot+8} Q172 ${bot+8} 172 ${bot} L172 ${top-14}" style="fill:none;stroke:var(--ink);stroke-width:4"/>`;
  if(showLabels){for(let v=minor;v<=max;v+=minor){const major=v%labelStep===0;s+=`<line x1="172" y1="${y(v)}" x2="${major?148:158}" y2="${y(v)}" style="stroke:var(--ink);stroke-width:${major?2.5:1.5}"/>`;if(major)s+=`<text x="180" y="${y(v)+5}" font-size="13" font-weight="800">${v}</text>`}
    s+=`<text x="180" y="${top-16}" font-size="13" font-weight="800" style="fill:var(--muted)">mL</text>`}
  return s+'</svg>';
}
function dial(g,size=230){
  const cx=120,cy=140,pt=(deg,r)=>[cx+r*Math.sin(deg*Math.PI/180),cy-r*Math.cos(deg*Math.PI/180)];

  s+=`<circle cx="${cx}" cy="${cy}" r="102" style="fill:var(--card);stroke:var(--ink);stroke-width:5"/>`;
  for(let v=0;v<1000;v+=50){const big=v%100===0;const [x1,y1]=pt(v*.36,big?80:88),[x2,y2]=pt(v*.36,96);s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(--ink);stroke-width:${big?3:1.5}"/>`;
    if(big){const [tx,ty]=pt(v*.36,64);s+=`<text x="${tx}" y="${ty+5}" text-anchor="middle" font-size="13" font-weight="800">${v}</text>`}}
  s+=`<text x="${cx}" y="${cy+42}" text-anchor="middle" font-size="13" font-weight="800" style="fill:var(--muted)">grams</text>`;
  const [px,py]=pt(g*.36,84);

function cupRows(items){

function balance(left,right,tilt){ /* left/right: {label} or {cubes:n}; tilt: -1 left down, 0 level, 1 right down */
  const th=tilt*10*Math.PI/180, c=Math.cos(th), sn=Math.sin(th);
  const lx=150-100*c, ly=72-100*sn, rx=150+100*c, ry=72+100*sn;

  s+=`<line x1="${lx}" y1="${ly}" x2="${rx}" y2="${ry}" style="stroke:var(--ink);stroke-width:6;stroke-linecap:round"/><circle cx="150" cy="72" r="6" style="fill:var(--ink)"/>`;
  const pan=(x,y,o)=>{let p=`<line x1="${x}" y1="${y}" x2="${x-32}" y2="${y+50}" style="stroke:var(--muted);stroke-width:1.5"/><line x1="${x}" y1="${y}" x2="${x+32}" y2="${y+50}" style="stroke:var(--muted);stroke-width:1.5"/><path d="M${x-40} ${y+50} Q${x} ${y+68} ${x+40} ${y+50} Z" style="fill:var(--line);stroke:var(--ink);stroke-width:2"/>`;
    if(o.cubes){for(let k=0;k<o.cubes;k++){const col=k%5,row=Math.floor(k/5);p+=`<rect x="${x-26+col*11}" y="${y+38-row*11}" width="10" height="10" rx="1.5" style="fill:var(--cube);stroke:var(--ink);stroke-width:.8"/>`}}
    else p+=`<text x="${x}" y="${y+44}" text-anchor="middle" font-size="15" font-weight="800">${esc(o.label)}</text>`;
    return p};
  return s+pan(lx,ly,left)+pan(rx,ry,right)+'</svg>';
}

function knuckles(){

  s+=`<path d="M20 120 Q20 60 60 56 L380 56 Q420 60 420 120 Z" style="fill:var(--wattle-soft);stroke:var(--wattle);stroke-width:2"/>`;
  ms.forEach((m,i)=>{const x=50+i*56,knuckle=i%2===0;s+=knuckle?`<circle cx="${x}" cy="56" r="18" style="fill:var(--wattle);"/>`:`<circle cx="${x}" cy="70" r="6" style="fill:var(--muted)"/>`;
    s+=`<text x="${x}" y="${knuckle?30:96}" text-anchor="middle" font-size="14" font-weight="800">${m}</text><text x="${x}" y="${knuckle?62:116}" text-anchor="middle" font-size="12" font-weight="800" style="fill:${knuckle?'var(--ink)':'var(--muted)'}">${knuckle?31:(m==='Feb'?'28':30)}</text>`});
  return s+`<text x="220" y="144" text-anchor="middle" font-size="12" style="fill:var(--muted)">Knuckle = 31 days. Dip = 30 (Feb 28). Start again on the first knuckle for August.</text></svg>`;
}

function graphQ(kind,per){
  const sets=[['Swimming','Cricket','Netball','Footy'],['Mango','Apple','Banana','Grapes'],['Koala','Wombat','Kangaroo','Echidna'],['Car','Bus','Walk','Bike'],['Slide','Swings','Monkey bars','Sandpit']];
  const labels=P(sets),scale=kind==='col'?per:1;
  let max, vals;
  if(per===1){vals=labels.map(()=>R(1,9));max=10}
  else if(kind==='pic'){vals=labels.map(()=>R(2,14))}
  else if(per===2){vals=labels.map(()=>R(2,19));max=20}
  else {vals=labels.map(()=>5*R(1,6));max=30}
  const vis=kind==='pic'?picGraph(labels.map((l,i)=>({label:l,n:vals[i]})),per):colGraph(labels,vals,scale,max,P(['Class survey','Our survey','Favourites']));
  const t=R(0,3);const i=R(0,3);let j=R(0,3);while(j===i)j=R(0,3);
  const keyNote=kind==='pic'&&per===2?' Remember the key: each circle is 2, a half circle is 1.':kind==='col'&&per>1?` The scale goes up in ${per}s.`:'';
  if(t===0)return {q:`How many chose ${labels[i]}?${kind==='pic'&&per===2?' Read the key first.':''}`,vis,type:'num',ans:vals[i],why:kind==='pic'&&per===2?`${Math.floor(vals[i]/2)} circles × 2 = ${Math.floor(vals[i]/2)*2}${vals[i]%2?' plus a half circle (1) = '+vals[i]:''}.`:`The ${labels[i]} ${kind==='pic'?'row':'bar'} shows ${vals[i]}.${keyNote}`};
  if(t===1){const [a,b]=vals[i]>=vals[j]?[i,j]:[j,i];if(vals[a]===vals[b])return graphQ(kind,per);return {q:`How many more chose ${labels[a]} than ${labels[b]}?`,vis,type:'num',ans:vals[a]-vals[b],why:`${labels[a]} ${vals[a]} − ${labels[b]} ${vals[b]} = ${vals[a]-vals[b]}.${keyNote}`}}
  if(t===2){const most=Math.random()<.5;const target=most?Math.max(...vals):Math.min(...vals);if(vals.filter(v=>v===target).length>1)return graphQ(kind,per);const k=vals.indexOf(target);return {q:`Which was chosen the ${most?'most':'least'}?`,vis,type:'choice',ans:labels[k],ch:labels.slice(),why:`${labels[k]} has the ${most?'longest':'shortest'} ${kind==='pic'?'row':'bar'}: ${target}.`}}
  const tot=vals.reduce((a,b)=>a+b,0);return {q:'How many were asked altogether?',vis,type:'num',ans:tot,why:`${vals.join(' + ')} = ${tot}.`};
}

let state={level:'y2',tab:'learn',lesson:null};

try{const l=localStorage.getItem('asmiMaths.level');if(l==='y2'||l==='y3')state.level=l}catch(e){}
const save=()=>{try{localStorage.setItem('asmiMaths.scores',JSON.stringify(scores));localStorage.setItem('asmiMaths.ready',JSON.stringify(ready));localStorage.setItem('asmiMaths.level',state.level)}catch(e){}};
const starsFor=(score,total)=>score/total>=.9?3:score/total>=.7?2:score/total>=.5?1:0;
function totalStars(){return Object.values(scores).reduce((a,s)=>a+starsFor(s.best,s.total),0)}

const view=document.getElementById('view');
function setLevel(l){state.level=l;state.lesson=null;save();render()}
document.getElementById('lvY2').onclick=()=>setLevel('y2');
document.getElementById('lvY3').onclick=()=>setLevel('y3');
document.getElementById('tabLearn').onclick=()=>{state.tab='learn';state.lesson=null;render()};
document.getElementById('tabParent').onclick=()=>{state.tab='parent';state.lesson=null;render()};

function render(){
  document.getElementById('lvY2').setAttribute('aria-pressed',state.level==='y2');
  document.getElementById('lvY3').setAttribute('aria-pressed',state.level==='y3');
  document.getElementById('tabLearn').setAttribute('aria-selected',state.tab==='learn');
  document.getElementById('tabParent').setAttribute('aria-selected',state.tab==='parent');
  document.getElementById('starCount').textContent=totalStars();
  if(state.tab==='parent')return renderParent();
  if(state.lesson)return renderLesson(state.lesson);
  renderHome();
}

function lessonCard(num,l,extra=''){
  const s=scores[l.id];const st=s?starsFor(s.best,s.total):0;
  return `<button class="lesson ${extra}" data-open="${l.id}"><span class="num">${num}</span><span class="t">${esc(l.title)}</span><span class="d">${esc(l.d)}</span><span class="row"><span class="mini-stars">${starsSVG(st)}</span><span>${s?`Best ${s.best}/${s.total}`:'Not started'}</span></span></button>`;
}
function renderHome(){
  const lv=LEVELS[state.level];
  let h=`<div class="wrap" style="gap:26px"><section class="intro"><span class="eyebrow">${lv.name} · ${lv.tag==='now'?'current level':'next level'}</span><h2>${lv.tag==='now'?'Year 2 review':'Getting ready for Year 3'}</h2><p>${esc(lv.intro)}</p></section>`;
  lv.units.forEach((u,ui)=>{
    h+=`<section class="unit"><div class="unit-head"><h2>${ui+1}. ${esc(u.title)}</h2><span class="muted" style="font-size:14px">${esc(u.strand)}${u.weeks?' · '+u.weeks:''}</span></div><div class="lessons">${u.lessons.map((l,li)=>lessonCard(`Lesson ${ui+1}.${li+1}`,l)).join('')}</div></section>`;
  });
  h+=`<section class="unit"><div class="unit-head"><h2>${lv.units.length+1}. ${lv.project?'Review and project':'Review'}</h2><span class="muted" style="font-size:14px">All strands${lv.project?' · Week 10':''}</span></div><div class="lessons">${lv.project?lessonCard('Project',lv.project,'review'):''}${lessonCard('Review',lv.review,'review')}</div></section></div>`;
  view.innerHTML=h;
  view.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.lesson=b.dataset.open;render();window.scrollTo({top:0})});
}

function findLesson(id){
  for(const lv of Object.values(LEVELS)){
    if(lv.review.id===id)return {lv,l:lv.review,kind:'review'};
    if(lv.project&&lv.project.id===id)return {lv,l:lv.project,kind:'project'};
    for(const u of lv.units)for(const l of u.lessons)if(l.id===id)return {lv,u,l,kind:'lesson'};
  }
}

    h+=`<div class="yourturn"><span class="lab">Your turn, on paper</span><p>${esc(l.turn)}</p></div></section>`;
  } else if(kind==='project'){
    h+=`<section class="panel"><div class="say"><span class="lab">Project overview</span><p>Plan a family cook-up day. Asmi is the head chef and event planner, so she will use time, capacity, mass and data skills at every step. Do the real cooking and pouring together, then answer the questions below.</p></div>

    <tr><td>1. Choose a date</td><td>Pick a Saturday or Sunday on the March 2027 calendar.</td><td>Calendar</td></tr>
    <tr><td>2. Plan the schedule</td><td>Shopping 9:30 am. Cooking from 10:15 am for 1 hour 45 minutes. Lunch at 12:30 pm.</td><td>Elapsed time</td></tr>
    <tr><td>3. Measure the lemonade</td><td>Each of 8 guests gets 250 mL.</td><td>Capacity</td></tr>
    <tr><td>4. Weigh the ingredients</td><td>Pancakes for 4 use 300 g flour. Make enough for 8.</td><td>Mass</td></tr>
    <tr><td>5. Survey</td><td>Ask 20 guests their favourite dish. Make a picture graph (1 symbol = 2).</td><td>Data</td></tr></table></div></section>`;
  } else {
    h+=`<section class="panel"><p>Ten questions mixed from every ${lv.name} lesson. Do this one without help, then look back at any lesson where Asmi got stuck.</p></section>`;
  }
  h+=`<section class="practice" id="practice"></section></div>`;
  view.innerHTML=h;
  document.getElementById('back').onclick=()=>{state.lesson=null;render();window.scrollTo({top:0})};
  startPractice(id,kind,lv,l);
}

/* ---------- practice round ---------- */
function speak(text){try{const u=new SpeechSynthesisUtterance(text);const v=speechSynthesis.getVoices().find(v=>/en-AU/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));if(v)u.voice=v;u.rate=.92;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function makeQuestions(kind,lv,l){
  if(kind==='project')return PROJECT.map(q=>({...q,ch:q.ch?shuffle(q.ch):q.ch}));
  const gens=kind==='review'?allLessons(lv):[l];const n=kind==='review'?10:8;const out=[];const seen=new Set();
  let guard=0;while(out.length<n&&guard<200){guard++;const g=kind==='review'?gens[out.length%gens.length===0?R(0,gens.length-1):R(0,gens.length-1)]:l;const q=g.gen();const key=q.q+'|'+q.ans;if(seen.has(key))continue;seen.add(key);out.push(q)}
  return out;
}
function startPractice(id,kind,lv,l){
  const box=document.getElementById('practice');
  const qs=makeQuestions(kind,lv,l);let i=0,res=[],picked=null,answered=false;
  const intro=kind==='lesson'?'Practice round':kind==='project'?'Cook-Up Day questions':'Mixed review';
  function draw(){
    if(i>=qs.length)return finish();
    const q=qs[i];picked=null;answered=false;
    box.innerHTML=`<div class="ph"><h3>${intro} · Question ${i+1} of ${qs.length}</h3><div class="dots">${qs.map((_,k)=>`<i class="${k<i?(res[k]?'ok':'no'):k===i?'now':''}"></i>`).join('')}</div></div>
      <p class="qtext" id="qtext">${esc(q.q)}</p>
      ${q.vis?`<div class="qvis">${q.vis}</div>`:''}
      ${q.type==='num'?`<div class="answer"><label for="ans" class="muted" style="font-weight:700">Answer</label>${q.pre?`<span class="unitlab">${q.pre}</span>`:''}<input id="ans" type="text" inputmode="numeric" autocomplete="off">${q.suf?`<span class="unitlab">${esc(q.suf)}</span>`:''}</div>`
        :`<div class="choices">${q.ch.map(c=>`<button class="choice" data-c="${esc(c)}">${q.chHTML&&q.chHTML[c]?q.chHTML[c]:esc(c)}</button>`).join('')}</div>`}
      <div id="fb"></div>
      <div class="actions"><button class="btn" id="check" ${q.type==='choice'?'disabled':''}>Check</button><button class="btn ghost small" id="read" type="button">Read it to me</button></div>`;
    const check=box.querySelector('#check');
    box.querySelector('#read').onclick=()=>speak(q.q);
    if(q.type==='num'){const inp=box.querySelector('#ans');inp.focus({preventScroll:true});inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check.click()}})}
    else box.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(answered)return;box.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');picked=b.dataset.c;check.disabled=false});
    check.onclick=()=>{
      if(answered){i++;draw();box.scrollIntoView({behavior:'smooth',block:'start'});return}
      let ok;
      if(q.type==='num'){const raw=box.querySelector('#ans').value.replace(/[$,\s]|mL|kg|g|L|cm|min(ute)?s?|cups?|days?|weeks?|hours?|seconds?/gi,'');if(raw===''){box.querySelector('#ans').focus();return}ok=Math.abs(Number(raw)-Number(q.ans))<1e-9;box.querySelector('#ans').disabled=true}
      else{if(picked==null)return;ok=picked===String(q.ans);box.querySelectorAll('.choice').forEach(b=>{if(b.dataset.c===String(q.ans))b.classList.add('right');else if(b.dataset.c===picked)b.classList.add('wrong')})}
      answered=true;res.push(ok);
      const ansTxt=q.type==='num'?`${q.pre||''}${q.ans}${q.suf?' '+q.suf:''}`:(q.chHTML?'':String(q.ans));
      box.querySelector('#fb').innerHTML=`<div class="feedback ${ok?'ok':'no'}"><strong>${ok?P(['Correct!','Spot on!','Great thinking!','Yes!']):'Not quite.'}</strong>${!ok&&ansTxt?`<span>The answer is <b>${esc(ansTxt)}</b>.</span>`:''}<span>${esc(q.why||'')}</span></div>`;
      check.textContent=i===qs.length-1?'See my score':'Next question';
    };
  }
  function finish(){
    const score=res.filter(Boolean).length,total=qs.length,st=starsFor(score,total);
    const prev=scores[id];if(!prev||score>prev.best||prev.total!==total)scores[id]={best:Math.max(score,prev&&prev.total===total?prev.best:0),total};save();
    document.getElementById('starCount').textContent=totalStars();
    const msg=st===3?'Brilliant work. You have mastered this one.':st===2?'Very good. One more round could make it three stars.':st===1?'Good effort. Look at the worked examples again, then have another go.':'This one is tricky. Read the lesson together and try again.';
    box.innerHTML=`<div class="result"><div class="big-stars">${starsSVG(st)}</div><h2>${score} out of ${total}</h2><p class="muted" style="max-width:46ch">${msg}</p><div class="actions" style="justify-content:center"><button class="btn" id="again">New questions</button><button class="btn ghost" id="home">Back to lessons</button></div></div>`;
    box.querySelector('#again').onclick=()=>startPractice(id,kind,lv,l);
    box.querySelector('#home').onclick=()=>{state.lesson=null;render();window.scrollTo({top:0})};
  }
  draw();
}

  <section class="panel"><h3>Ready-to-go check (5 minutes)</h3><p class="muted">Can Asmi… If any box is a “not yet”, spend a few days on it first.</p><div class="checklist">${checks.map((c,i)=>{const k=state.level+'-'+i;return `<label><input type="checkbox" id="rc-${k}" data-k="${k}" ${ready[k]?'checked':''}><span>${esc(c)}</span></label>`}).join('')}</div></section>
  <section class="panel"><h3>${state.level==='y3'?'10-week plan · 3 sessions a week, about 40 minutes each':'Plan for the rest of Term 4 · 3 sessions a week, about 30 minutes each'}</h3><div class="tablewrap"><table class="tt"><tr><th>Week</th><th>Topic</th><th>Session 1</th><th>Session 2</th><th>Session 3</th></tr>${plan.map(r=>`<tr>${r.map((c,i)=>`<td style="text-align:${i<2?'center':'left'}">${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div></section>
  <section class="panel hands"><h3>Hands-on activities</h3><div class="grid3">${Object.entries(HANDS[state.level]).map(([t,list])=>`<div><b>${esc(t)}</b><ul>${list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div></section>
  <section class="panel"><h3>Teaching tips</h3><div class="tablewrap"><table class="tt"><tr><th>Do this</th><th>Avoid this</th></tr>
  <tr><td>Measure with real objects first, then talk about the numbers</td><td>Rushing to worksheets without hands-on measuring</td></tr>
  <tr><td>Ask “How do you know?” and “Can you show me another way?”</td><td>Giving the answer too quickly. Wait 30 seconds.</td></tr>
  <tr><td>Use number-line jumps for time and measures</td><td>Teaching tricks without understanding</td></tr>
  <tr><td>Make mistakes safe: “Let’s test it and find out!”</td><td>Praising only correct answers</td></tr>
  <tr><td>Cook, shop and travel together, and use the maths out loud</td><td>Keeping maths only at the table</td></tr></table></div>
  <p class="muted" style="font-size:14px">Curriculum: Victorian Curriculum F–10 v2.0, Mathematics, Levels 2 and 3 (<a href="https://f10.vcaa.vic.edu.au/" target="_blank" rel="noopener" style="color:var(--sky)">f10.vcaa.vic.edu.au</a>).</p>
  <div class="actions"><button class="btn ghost small" id="reset">Reset all stars</button><span id="resetMsg" class="muted" style="font-size:14px"></span></div></section></div>`;
  view.innerHTML=h;
  view.querySelectorAll('.checklist input').forEach(c=>c.onchange=()=>{ready[c.dataset.k]=c.checked;save()});

  rb.onclick=()=>{if(!armed){armed=true;rb.textContent='Tap again to confirm';document.getElementById('resetMsg').textContent='This clears every star on this device.';return}scores={};save();render()};
}
