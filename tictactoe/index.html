<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graph Paper Tic-Tac-Toe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one notebook page on graph paper — hand-drawn board centered, scoreboard of tally marks and controls beneath */
:root {
  --paper: #f5f7f2;
  --grid: rgba(64, 104, 150, 0.16);
  --grid-major: rgba(64, 104, 150, 0.28);
  --text: #1d2531;
  --muted: #586373;
  --ink-x: #2346a8;
  --ink-o: #c42f3b;
  --chip: #e6ebe3;
  --chip-on: #1d2531;
  --chip-on-text: #f5f7f2;
  --focus: #2346a8;
  --font-hand: "Caveat Brush", "Segoe Print", "Comic Sans MS", cursive;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #111923;
    --grid: rgba(140, 180, 230, 0.09);
    --grid-major: rgba(140, 180, 230, 0.17);
    --text: #e4eaf2;
    --muted: #93a0b2;
    --ink-x: #8fb3ff;
    --ink-o: #ff8a8f;
    --chip: #1c2633;
    --chip-on: #e4eaf2;
    --chip-on-text: #111923;
    --focus: #8fb3ff;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #111923;
  --grid: rgba(140, 180, 230, 0.09);
  --grid-major: rgba(140, 180, 230, 0.17);
  --text: #e4eaf2;
  --muted: #93a0b2;
  --ink-x: #8fb3ff;
  --ink-o: #ff8a8f;
  --chip: #1c2633;
  --chip-on: #e4eaf2;
  --chip-on-text: #111923;
  --focus: #8fb3ff;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main {
  max-width: 460px;
  margin: 0 auto;
  padding-block: 28px 40px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
header { display: flex; flex-direction: column; gap: 2px; }
h1 {
  font-family: var(--font-hand);
  font-weight: 400;
  font-size: clamp(2.4rem, 9vw, 3.2rem);
  line-height: 1;
  margin: 0;
  text-wrap: balance;
}
h1 .x { color: var(--ink-x); }
h1 .o { color: var(--ink-o); }

.status {
  font-family: var(--font-hand);
  font-size: 1.75rem;
  line-height: 1.1;
  min-height: 1.2em;
  margin: 0;
}
.status .x { color: var(--ink-x); }
.status .o { color: var(--ink-o); }

.board-wrap { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1; }
.board-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.cells {
  position: absolute; inset: 0;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
}
.cell {
  appearance: none; border: 0; background: transparent; margin: 0; padding: 0;
  cursor: pointer; border-radius: 8px;
}
.cell:disabled { cursor: default; }
.cell:not(:disabled):hover { background: color-mix(in srgb, var(--text) 5%, transparent); }
.cell:focus-visible { outline: 3px solid var(--focus); outline-offset: -8px; }

.grid-line { stroke: var(--text); stroke-width: 4; stroke-linecap: round; fill: none; }
.mark { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 9; }
.mark.x { stroke: var(--ink-x); }
.mark.o { stroke: var(--ink-o); }
.draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw var(--dur, 260ms) ease-out forwards; animation-delay: var(--delay, 0ms); }
.strike { stroke: var(--text); stroke-width: 7; stroke-linecap: round; fill: none; opacity: .85; }
@keyframes draw { to { stroke-dashoffset: 0; } }

.score {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  border-top: 2px solid var(--text); padding-top: 12px;
}
.tally { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tally .label {
  font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  display: flex; justify-content: space-between; gap: 6px;
}
.tally .num { font-variant-numeric: tabular-nums; color: var(--text); }
.tally svg { width: 100%; height: 34px; display: block; }
.tally.x svg path { stroke: var(--ink-x); }
.tally.o svg path { stroke: var(--ink-o); }
.tally.d svg path { stroke: var(--muted); }
.tally svg path { stroke-width: 3; stroke-linecap: round; fill: none; }

.controls { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.row .row-label { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); width: 5.5rem; }
.seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button {
  appearance: none; border: 0; background: transparent; color: var(--text);
  font: 700 .9rem/1 var(--font-body); padding: 9px 14px; border-radius: 999px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-text); }
.seg button:focus-visible, .actions button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.seg button:disabled { opacity: .4; cursor: default; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.actions button {
  appearance: none; cursor: pointer; font: 400 1.5rem/1 var(--font-hand);
  padding: 10px 20px 8px; border-radius: 6px;
  border: 2px solid var(--text); background: var(--paper); color: var(--text);
  box-shadow: 3px 3px 0 var(--text);
  transition: transform .08s, box-shadow .08s;
}
.actions button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--text); }
.actions button.quiet { border-color: transparent; box-shadow: none; background: transparent; color: var(--muted); font-size: 1.25rem; }
.hint { color: var(--muted); font-size: .85rem; margin: 0; }
kbd { font-family: var(--font-body); font-size: .8rem; border: 1px solid var(--muted); border-radius: 4px; padding: 0 5px; }

@media (prefers-reduced-motion: reduce) {
  .draw { animation: none; stroke-dashoffset: 0; }
  .actions button { transition: none; }
}
</style>
</head>
<body>

<main>
  <header>
    <h1>Tic&#8209;<span class="x">Tac</span>&#8209;<span class="o">Toe</span></h1>
  </header>

  <p class="status" id="status" aria-live="polite"></p>

  <div class="board-wrap">
    <svg viewBox="0 0 300 300" aria-hidden="true">
      <path class="grid-line" d="M101 8 C 99 90, 102 200, 99 292" />
      <path class="grid-line" d="M201 6 C 203 110, 199 210, 202 294" />
      <path class="grid-line" d="M7 100 C 90 102, 200 98, 293 101" />
      <path class="grid-line" d="M6 201 C 110 199, 210 203, 294 199" />
      <g id="marks"></g>
      <g id="strike"></g>
    </svg>
    <div class="cells" id="cells" role="grid" aria-label="Tic-tac-toe board"></div>
  </div>

  <section class="score" aria-label="Score">
    <div class="tally x"><div class="label"><span>X</span><span class="num" id="n-X">0</span></div><svg id="t-X" viewBox="0 0 120 34" preserveAspectRatio="xMinYMid meet" aria-hidden="true"></svg></div>
    <div class="tally o"><div class="label"><span id="o-name">O</span><span class="num" id="n-O">0</span></div><svg id="t-O" viewBox="0 0 120 34" preserveAspectRatio="xMinYMid meet" aria-hidden="true"></svg></div>
    <div class="tally d"><div class="label"><span>Draws</span><span class="num" id="n-D">0</span></div><svg id="t-D" viewBox="0 0 120 34" preserveAspectRatio="xMinYMid meet" aria-hidden="true"></svg></div>
  </section>

  <section class="controls" aria-label="Game settings">
    <div class="row">
      <span class="row-label" id="lbl-mode">Opponent</span>
      <div class="seg" role="group" aria-labelledby="lbl-mode">
        <button type="button" id="mode-cpu" data-mode="cpu">Computer</button>
        <button type="button" id="mode-pvp" data-mode="pvp">Friend</button>
      </div>
    </div>
    <div class="row">
      <span class="row-label" id="lbl-level">Computer</span>
      <div class="seg" role="group" aria-labelledby="lbl-level">
        <button type="button" id="lvl-easy" data-level="easy">Easy</button>
        <button type="button" id="lvl-fair" data-level="fair">Fair</button>
        <button type="button" id="lvl-hard" data-level="hard">Unbeatable</button>
      </div>
    </div>
    <div class="actions">
      <button type="button" id="new-round">New round</button>
      <button type="button" id="reset-score" class="quiet">Clear score</button>
    </div>
    <p class="hint">You play X. Players take turns going first. Keys <kbd>1</kbd>–<kbd>9</kbd> pick a square, <kbd>N</kbd> starts a new round.</p>
  </section>
</main>

<script>
(function () {
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  let S, cpuTimer = null;

  function fresh(prev) {
    return {
      board: Array(9).fill(null),
      turn: "X", starter: "X",
      mode: prev?.mode || "cpu", level: prev?.level || "hard",
      score: prev?.score || { X: 0, O: 0, D: 0 },
      over: false, line: null, winner: null
    };
  }

  function winnerOf(b) {
    for (const l of LINES) {
      const [a, c, d] = l;
      if (b[a] && b[a] === b[c] && b[a] === b[d]) return { who: b[a], line: l };
    }
    return b.every(Boolean) ? { who: "D", line: null } : null;
  }

  // Minimax, preferring faster wins and slower losses.
  function minimax(b, me, toMove, depth) {
    const r = winnerOf(b);
    if (r) return r.who === "D" ? 0 : (r.who === me ? 10 - depth : depth - 10);
    let best = toMove === me ? -Infinity : Infinity;
    for (let i = 0; i < 9; i++) if (!b[i]) {
      b[i] = toMove;
      const v = minimax(b, me, toMove === "X" ? "O" : "X", depth + 1);
      b[i] = null;
      best = toMove === me ? Math.max(best, v) : Math.min(best, v);
    }
    return best;
  }
  function bestMoves(b, me) {
    let best = -Infinity, moves = [];
    for (let i = 0; i < 9; i++) if (!b[i]) {
      b[i] = me;
      const v = minimax(b, me, me === "X" ? "O" : "X", 1);
      b[i] = null;
      if (v > best) { best = v; moves = [i]; } else if (v === best) moves.push(i);
    }
    return moves;
  }
  function cpuPick() {
    const empty = S.board.map((v, i) => v ? -1 : i).filter(i => i >= 0);
    const smart = { easy: 0.25, fair: 0.7, hard: 1 }[S.level];
    const pool = Math.random() < smart ? bestMoves(S.board.slice(), "O") : empty;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // ---------- drawing ----------
  function el(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
  function jitter(n) { return (Math.random() - 0.5) * n; }

  function drawMark(i, who, animate) {
    const cx = (i % 3) * 100 + 50, cy = Math.floor(i / 3) * 100 + 50;
    const g = el("g", {});
    const paths = [];
    if (who === "X") {
      const r = 26;
      paths.push(`M${cx - r + jitter(4)} ${cy - r + jitter(4)} L${cx + r + jitter(4)} ${cy + r + jitter(4)}`);
      paths.push(`M${cx + r + jitter(4)} ${cy - r + jitter(4)} L${cx - r + jitter(4)} ${cy + r + jitter(4)}`);
    } else {
      const r = 28, start = -1.9 + jitter(0.4);
      let d = "";
      for (let k = 0; k <= 36; k++) {
        const t = start + (k / 36) * Math.PI * 2.12;
        const rr = r + Math.sin(k * 0.7) * 1.4;
        d += (k ? " L" : "M") + (cx + Math.cos(t) * rr).toFixed(1) + " " + (cy + Math.sin(t) * rr * 0.94).toFixed(1);
      }
      paths.push(d);
    }
    paths.forEach((d, k) => {
      const p = el("path", { d, class: "mark " + who.toLowerCase() });
      g.appendChild(p);
      if (animate) {
        const len = Math.ceil(p.getTotalLength ? 0 : 0); // measured after insert
        p.dataset.k = k;
      }
    });
    $("marks").appendChild(g);
    if (animate) g.querySelectorAll("path").forEach((p, k) => {
      const len = Math.ceil(p.getTotalLength()) + 2;
      p.style.setProperty("--len", len);
      p.style.setProperty("--delay", (k * 160) + "ms");
      p.style.setProperty("--dur", who === "O" ? "380ms" : "180ms");
      p.classList.add("draw");
    });
  }

  function drawStrike(line, animate) {
    const c = (i) => [(i % 3) * 100 + 50, Math.floor(i / 3) * 100 + 50];
    const [x1, y1] = c(line[0]), [x2, y2] = c(line[2]);
    const dx = x2 - x1, dy = y2 - y1, m = Math.hypot(dx, dy), ext = 34;
    const ax = x1 - dx / m * ext, ay = y1 - dy / m * ext, bx = x2 + dx / m * ext, by = y2 + dy / m * ext;
    const p = el("path", { d: `M${ax} ${ay} Q ${(ax + bx) / 2 + jitter(8)} ${(ay + by) / 2 + jitter(8)} ${bx} ${by}`, class: "strike" });
    $("strike").appendChild(p);
    if (animate) {
      p.style.setProperty("--len", Math.ceil(p.getTotalLength()) + 2);
      p.style.setProperty("--delay", "260ms");
      p.style.setProperty("--dur", "320ms");
      p.classList.add("draw");
    }
  }

  function drawTally(svg, n) {
    svg.textContent = "";
    const shown = Math.min(n, 20);
    for (let k = 0; k < shown; k++) {
      const group = Math.floor(k / 5), pos = k % 5, gx = group * 30 + 4;
      let d;
      if (pos < 4) { const x = gx + pos * 5; d = `M${x + jitter(1.5)} 6 L${x + jitter(1.5)} 28`; }
      else d = `M${gx - 3} 24 L${gx + 20} 9`;
      svg.appendChild(el("path", { d }));
    }
  }

  // ---------- render ----------
  function cpuName() { return S.mode === "cpu" ? "Computer (O)" : "O"; }
  function nameOf(w) { return w === "X" ? (S.mode === "cpu" ? "You" : "X") : (S.mode === "cpu" ? "The computer" : "O"); }

  function render() {
    const cells = $("cells");
    [...cells.children].forEach((b, i) => {
      const v = S.board[i];
      const r = Math.floor(i / 3) + 1, c = (i % 3) + 1;
      b.setAttribute("aria-label", `Row ${r}, column ${c}: ${v || "empty"}`);
      b.disabled = !!v || S.over || (S.mode === "cpu" && S.turn === "O");
    });
    const st = $("status");
    if (S.over) {
      if (S.winner === "D") st.textContent = "A draw. Cat's game.";
      else st.innerHTML = `<span class="${S.winner.toLowerCase()}">${nameOf(S.winner)}</span> ${S.mode === "cpu" && S.winner === "X" ? "win" : "wins"}!`;
    } else if (S.mode === "cpu") {
      st.innerHTML = S.turn === "X" ? `Your move, <span class="x">X</span>.` : `<span class="o">O</span> is thinking…`;
    } else {
      st.innerHTML = `<span class="${S.turn.toLowerCase()}">${S.turn}</span> to move.`;
    }
    for (const k of ["X", "O", "D"]) { $("n-" + k).textContent = S.score[k]; drawTally($("t-" + k), S.score[k]); }
    $("o-name").textContent = cpuName();
    for (const b of document.querySelectorAll("[data-mode]")) b.setAttribute("aria-pressed", String(b.dataset.mode === S.mode));
    for (const b of document.querySelectorAll("[data-level]")) {
      b.setAttribute("aria-pressed", String(b.dataset.level === S.level));
      b.disabled = S.mode !== "cpu";
    }
  }

  function redrawAll() {
    $("marks").textContent = ""; $("strike").textContent = "";
    S.board.forEach((v, i) => v && drawMark(i, v, false));
    if (S.line) drawStrike(S.line, false);
  }

  // ---------- game flow ----------
  function play(i) {
    if (S.over || S.board[i]) return;
    S.board[i] = S.turn;
    drawMark(i, S.turn, true);
    const r = winnerOf(S.board);
    if (r) {
      S.over = true; S.winner = r.who; S.line = r.line; S.score[r.who]++;
      if (r.line) drawStrike(r.line, true);
    } else {
      S.turn = S.turn === "X" ? "O" : "X";
    }
    render();
    maybeCpu();
  }

  function maybeCpu() {
    clearTimeout(cpuTimer);
    if (S.mode === "cpu" && !S.over && S.turn === "O") {
      cpuTimer = setTimeout(() => play(cpuPick()), 520);
    }
  }

  function newRound() {
    clearTimeout(cpuTimer);
    const starter = S.starter === "X" ? "O" : "X";
    S = Object.assign(fresh(S), { starter, turn: starter });
    redrawAll(); render(); maybeCpu();
  }

  function start(saved) {
    S = saved && saved.board ? saved : fresh();
    const cells = $("cells");
    for (let i = 0; i < 9; i++) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "cell"; b.id = "cell-" + i;
      b.addEventListener("click", () => play(i));
      cells.appendChild(b);
    }
    document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => {
      if (S.mode === b.dataset.mode) return;
      S.mode = b.dataset.mode; S.score = { X: 0, O: 0, D: 0 }; S.starter = "O"; newRound();
    }));
    document.querySelectorAll("[data-level]").forEach(b => b.addEventListener("click", () => {
      S.level = b.dataset.level; render();
    }));
    $("new-round").addEventListener("click", newRound);
    $("reset-score").addEventListener("click", () => { S.score = { X: 0, O: 0, D: 0 }; render(); });
    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (/^[1-9]$/.test(e.key)) {
        const i = +e.key - 1;
        if (!(S.mode === "cpu" && S.turn === "O")) play(i);
      } else if (e.key === "n" || e.key === "N") newRound();
    });
    window.claude?.hot?.snapshot?.(() => S);
    redrawAll(); render(); maybeCpu();
  }

  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
